[project]
name = "terraform-provider-mycloud"
version = "0.1.0"
description = "mycloud tutorial provider — part 1: resource"
requires-python = ">=3.11"
dependencies = ["pyvider>=0.3.33"]

[project.scripts]
terraform-provider-mycloud = "my_provider:main"

[project.entry-points."pyvider"]
mycloud = "my_provider"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["my_provider"]

[tool.pyvider]
provider_name = "mycloud"
