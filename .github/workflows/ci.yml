name: "\U0001F4DA Tutorial CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  tutorial:
    name: "\U0001F9EA Part ${{ matrix.part }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            name: resource
          - part: 2
            name: data-source
          - part: 3
            name: function
          - part: 4
            name: ephemeral
          - part: 5
            name: deploy

    steps:
      # Checkout the tutorial repo.
      - name: "\U0001F4E5 Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Install Python for the pyvider provider runtime (skip under act — container has Python).
      - name: "\U0001F40D Setup Python"
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install uv for dependency management (skip under act — install via pip fallback).
      - name: "\U0001F4E6 Install UV"
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      # Install uv under act (standalone installer, no node/pip required).
      - name: "\U0001F4E6 Install UV (act)"
        if: env.ACT == 'true' || github.actor == 'nektos/act'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Install OpenTofu for running Terraform configurations (skip under act — install manually).
      - name: "\U0001F4DD Install OpenTofu"
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      # Install OpenTofu under act (no node required).
      - name: "\U0001F4DD Install OpenTofu (act)"
        if: env.ACT == 'true' || github.actor == 'nektos/act'
        run: ci/install-tofu.sh

      # Run the full Terraform lifecycle for this tutorial part.
      - name: "\U0001F680 Run part ${{ matrix.part }}"
        run: scripts/run-tutorial-part.sh ${{ matrix.part }}

      # Record the lifecycle as an asciinema cast file.
      - name: "\U0001F3AC Record cast"
        run: scripts/record-tutorial-part.sh ${{ matrix.part }} casts

      # Upload the cast for use by other workflows (e.g. site build).
      - name: "\U0001F4E4 Upload cast"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: tutorial-part${{ matrix.part }}-${{ matrix.name }}-cast
          path: casts/tutorial-part${{ matrix.part }}-${{ matrix.name }}.cast
          retention-days: 90
          if-no-files-found: error

  summary:
    name: "\U0001F4CB Summary"
    needs: [tutorial]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      # Generate a step summary with pass/fail per tutorial part.
      - name: "\U0001F4CA Generate summary"
        run: |
          echo "## Tutorial CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.tutorial.result }}" == "success" ]]; then
            echo "All tutorial parts passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tutorial parts failed. Check job logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
